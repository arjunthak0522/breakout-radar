name: Run Breakout Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live Breakout Radar
        env:
          STAGE2_COUNT: "139"
          LEADERBOARD_COUNT: "40"
          REQUEST_DELAY: "0.18"
        run: python scanner.py

      - name: Commit latest outputs
        run: |
          git config user.name "breakout-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update live Breakout Radar output"
            git push
          fi
